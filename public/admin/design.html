<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>디자인 관리</title>
<link rel="preconnect" href="https://r2.naru.pub">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="assets/js/core/firebase.js">
<link rel="modulepreload" href="assets/js/core/state.js">
<link rel="modulepreload" href="assets/js/shared/design.js">
<link rel="modulepreload" href="assets/js/admin/design-page.js">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;500;600;700;800&family=Pixelify+Sans:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
</head>
<body>
  <main class="container">
    <section class="card admin-board-editor">
      <div class="board-editor-head">
        <div>
          <h2>디자인 관리</h2>
          <p class="muted small">사용자 페이지의 배경색·글자색·폰트를 설정합니다.</p>
        </div>
        <div class="formRow board-editor-actions">
          <button class="btn" id="resetDesignBtn" type="button">기본값으로</button>
          <a class="btn" href="admin/index.html">대시보드</a>
        </div>
      </div>

      <div class="admin-board-layout mt-md">
        <div class="admin-board-form">
          <div class="settings-block">
            <div class="settings-block-head">
              <strong>테마 프리셋</strong>
              <span class="muted small">클릭하면 아래 색상 값이 채워집니다</span>
            </div>
            <div class="formRow" id="designPresetRow"></div>
          </div>

          <div class="settings-block mt-md">
            <div class="settings-block-head">
              <strong>색상</strong>
              <span class="muted small">#RRGGBB 형식</span>
            </div>
            <div class="grid tight">
              <div class="field-group">
                <label for="bgColorText">배경색</label>
                <div class="formRow">
                  <input type="color" id="bgColorPicker" value="#FFFFFF" style="flex:0 0 46px;min-height:34px;padding:2px;cursor:pointer;">
                  <input id="bgColorText" placeholder="기본 #FFFFFF" autocomplete="off" spellcheck="false">
                </div>
              </div>
              <div class="field-group">
                <label for="textColorText">글자색</label>
                <div class="formRow">
                  <input type="color" id="textColorPicker" value="#000000" style="flex:0 0 46px;min-height:34px;padding:2px;cursor:pointer;">
                  <input id="textColorText" placeholder="기본 #000000" autocomplete="off" spellcheck="false">
                </div>
              </div>
              <div class="field-group">
                <label for="accentColorText">포인트색 <span class="muted small">(본문 링크·제목 호버)</span></label>
                <div class="formRow">
                  <input type="color" id="accentColorPicker" value="#000000" style="flex:0 0 46px;min-height:34px;padding:2px;cursor:pointer;">
                  <input id="accentColorText" placeholder="기본 글자색과 동일" autocomplete="off" spellcheck="false">
                </div>
              </div>
              <div class="field-group">
                <label for="mutedColorText">보조 글자색 <span class="muted small">(날짜·메타 정보)</span></label>
                <div class="formRow">
                  <input type="color" id="mutedColorPicker" value="#6B6B6B" style="flex:0 0 46px;min-height:34px;padding:2px;cursor:pointer;">
                  <input id="mutedColorText" placeholder="기본 #6B6B6B" autocomplete="off" spellcheck="false">
                </div>
              </div>
              <div class="field-group">
                <label for="galleryCardBgText">갤러리 카드 배경 <span class="muted small">(갤러리 카드·LOG 썸네일 영역에 적용)</span></label>
                <div class="formRow">
                  <input type="color" id="galleryCardBgPicker" value="#FFFFFF" style="flex:0 0 46px;min-height:34px;padding:2px;cursor:pointer;">
                  <input id="galleryCardBgText" placeholder="기본 투명" autocomplete="off" spellcheck="false">
                </div>
              </div>
            </div>
          </div>

          <div class="settings-block mt-md">
            <div class="settings-block-head">
              <strong>버튼</strong>
              <span class="muted small">#RRGGBB 형식</span>
            </div>
            <div class="grid tight">
              <div class="field-group">
                <label for="btnBorderColorText">버튼 테두리</label>
                <div class="formRow">
                  <input type="color" id="btnBorderColorPicker" value="#000000" style="flex:0 0 46px;min-height:34px;padding:2px;cursor:pointer;">
                  <input id="btnBorderColorText" placeholder="기본 글자색과 동일" autocomplete="off" spellcheck="false">
                </div>
              </div>
              <div class="field-group">
                <label for="btnTextColorText">버튼 글자</label>
                <div class="formRow">
                  <input type="color" id="btnTextColorPicker" value="#000000" style="flex:0 0 46px;min-height:34px;padding:2px;cursor:pointer;">
                  <input id="btnTextColorText" placeholder="기본 글자색과 동일" autocomplete="off" spellcheck="false">
                </div>
              </div>
              <div class="field-group">
                <label for="btnBgColorText">버튼 배경</label>
                <div class="formRow">
                  <input type="color" id="btnBgColorPicker" value="#FFFFFF" style="flex:0 0 46px;min-height:34px;padding:2px;cursor:pointer;">
                  <input id="btnBgColorText" placeholder="기본 투명" autocomplete="off" spellcheck="false">
                </div>
              </div>
            </div>
          </div>

          <div class="settings-block mt-md">
            <div class="settings-block-head">
              <strong>폰트</strong>
              <span class="muted small">구글 폰트 이름 입력</span>
            </div>
            <div class="grid tight">
              <div class="field-group">
                <label for="headerFontInput">로고/내비 폰트 <span class="muted small">(홈 소개 관리의 "헤더 폰트"와 같은 설정)</span></label>
                <input id="headerFontInput" placeholder="기본 Pixelify Sans" autocomplete="off" spellcheck="false">
              </div>
              <div class="field-group">
                <label for="headingFontInput">제목 폰트 <span class="muted small">(게시판·최근 게시물 제목, 태그, 스킨 버튼)</span></label>
                <input id="headingFontInput" placeholder="기본 Pixelify Sans" autocomplete="off" spellcheck="false">
              </div>
              <div class="field-group">
                <label for="bodyFontInput">본문 폰트</label>
                <input id="bodyFontInput" placeholder="기본 Noto Sans KR" autocomplete="off" spellcheck="false">
              </div>
              <div class="muted small">
                폰트 이름은 <a href="https://fonts.google.com/?subset=korean" target="_blank" rel="noopener noreferrer" style="text-decoration:underline;">fonts.google.com</a>에 표기된 이름 그대로 입력하세요.
              </div>
            </div>
          </div>
        </div>

        <aside class="admin-board-summary">
          <div class="settings-block summary-panel">
            <div class="settings-block-head">
              <strong>미리보기</strong>
              <span class="muted small">저장 전 참고용</span>
            </div>
            <div id="designPreview" style="border:1px solid rgba(28,28,28,0.12);padding:16px;display:grid;gap:10px;">
              <div id="previewBrand" style="font-weight:700;letter-spacing:0.1em;font-size:1.1rem;">RYEORI</div>
              <div id="previewHeading" style="font-weight:800;font-size:1.2rem;">게시판 제목 Heading</div>
              <div id="previewBody" style="font-size:14px;line-height:1.7;">본문 텍스트 미리보기입니다. 배경색과 글자색 대비를 확인하세요. <a id="previewAccent" href="#" onclick="return false" style="text-decoration:underline;">포인트색 링크</a></div>
              <div id="previewMuted" style="font-size:12px;">2026. 7. 3. · 보조 텍스트(날짜·메타)</div>
              <div><span id="previewBtn" style="display:inline-block;border:1px solid currentcolor;padding:5px 12px;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;">BUTTON</span></div>
              <div id="previewGalleryCard" style="border:1px dashed rgba(128,128,128,0.5);padding:10px 8px;font-size:11px;text-align:center;">갤러리 카드 배경</div>
            </div>
            <div class="formRow board-editor-save-row mt-md">
              <button class="btn primary" id="saveDesignBtn" type="button">디자인 저장</button>
            </div>
            <div id="designMsg" class="notice hidden mt-sm"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script type="module" src="assets/js/admin/design-page.js"></script>
</body>
</html>
