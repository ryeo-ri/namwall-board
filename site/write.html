<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="./">
<title>게시물 작성</title>
<link rel="stylesheet" href="assets/css/style.css?v=1.2.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;500;600;700;800&family=Pixelify+Sans:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<!-- import 체인을 미리 병렬로 받는다 -->
<link rel="modulepreload" href="assets/js/core/naru-client.js">
<link rel="modulepreload" href="https://sdk.naru.pub/sdk/1.2.0/naru.js">
<link rel="modulepreload" href="assets/js/core/config.js">
<link rel="modulepreload" href="assets/js/core/site.js">
<link rel="modulepreload" href="assets/js/shared/design.js">
<link rel="modulepreload" href="assets/js/shared/media-budget.js">
<link rel="modulepreload" href="assets/js/shared/video.js">
<link rel="modulepreload" href="assets/js/shared/ui.js">
</head>
<body class="site-page">
  <div class="header">
    <div class="container">
      <div class="row">
        <a class="brand" href="index.html"><span id="siteTitle"></span></a>
        <nav class="nav" id="topNav"></nav>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="notice hidden" id="writeGate">
      <span id="writeGateText">글을 쓰려면 로그인이 필요합니다.</span>
      <div class="formRow mt-sm">
        <button type="button" class="btn primary" id="writeLoginBtn">회원 로그인</button>
        <button type="button" class="btn" id="writeAdminLoginBtn">관리자 로그인</button>
      </div>
    </div>

    <section class="card write-page write-compact hidden" id="writeForm">
      <div class="write-head">
        <div>
          <h2 id="writeHeading">게시물 작성</h2>
          <p class="muted small">아래 순서대로 입력하면 됩니다.</p>
        </div>
      </div>

      <div class="notice hidden mt-sm" id="writeMsg"></div>

      <div class="write-form mt-md">
        <div class="write-row write-static-row">
          <div class="write-label">게시판</div>
          <div class="write-static-field inline">
            <strong id="boardCurrentValue">-</strong>
          </div>
          <select id="boardSelect" class="hidden"></select>
        </div>

        <div class="write-row write-static-row">
          <div class="write-label">작성자</div>
          <div class="write-static-field inline">
            <strong id="authorCurrentValue">-</strong>
          </div>
        </div>

        <div id="categoryFields" class="write-row hidden">
          <div class="field-group">
            <label class="write-label" for="categorySelect">분류</label>
            <select id="categorySelect"></select>
          </div>
        </div>

        <div id="logOnlyFields" class="write-row write-log-row hidden">
          <label class="muted small" for="logNumberInput">로그번호</label>
          <input id="logNumberInput" placeholder="자동 부여">
        </div>

        <div class="write-row" id="thumbSection">
          <div class="write-thumb-head">
            <div class="write-label">대표이미지</div>
            <div class="write-mode-row">
              <label><input type="radio" name="thumbMode" value="file" id="thumbModeFile" checked> 파일</label>
              <label><input type="radio" name="thumbMode" value="url" id="thumbModeUrl"> URL</label>
              <label id="thumbModeVideoLabel"><input type="radio" name="thumbMode" value="video" id="thumbModeVideo"> VIDEO</label>
              <label id="thumbModeTextLabel" class="hidden"><input type="radio" name="thumbMode" value="text" id="thumbModeText"> TEXT</label>
            </div>
          </div>
          <div class="write-thumb-panel">
            <div id="thumbUrlFields" class="write-field-block hidden">
              <label class="muted small" for="imageUrlInput">이미지 URL</label>
              <input id="imageUrlInput" placeholder="https://...">
            </div>

            <div id="thumbFileFields" class="write-field-block">
              <div class="write-thumb-dropzone" id="thumbDropZone" tabindex="0" role="button" aria-label="썸네일 이미지 파일 선택">
                <div class="formRow write-file-row">
                  <button type="button" class="btn" id="selectThumbFileBtn">파일 선택</button>
                  <button type="button" class="btn hidden" id="clearThumbFileBtn">선택 삭제</button>
                </div>
                <span>이미지를 끌어놓거나 Ctrl+V로 붙여넣기</span>
              </div>
              <input id="thumbFileInput" type="file" accept="image/*" class="hidden">
            </div>

            <div id="thumbVideoFields" class="write-field-block hidden">
              <label class="muted small" for="thumbVideoInput">VIDEO</label>
              <textarea id="thumbVideoInput" class="write-video-input" rows="3" placeholder="유튜브 링크 또는 iframe 코드를 붙여넣으세요."></textarea>
            </div>

            <div id="thumbTextFields" class="write-field-block hidden">
              <label class="muted small" for="thumbTextInput" id="thumbTextLabel">TEXT</label>
              <textarea id="thumbTextInput" class="textarea" rows="5" placeholder="이미지 대신 카드에 보여줄 텍스트"></textarea>
              <p class="muted small hidden" id="thumbTextNote">이미지 없이 본문만 올립니다.</p>
            </div>

            <div id="thumbPreview" class="previewGrid mt-sm"></div>
          </div>
        </div>

        <div class="write-row" id="visibilityFields">
          <div class="write-field-block" id="visibilityInnerFields">
            <label class="muted small" for="visibilityInput">공개범위</label>
            <div class="write-visibility-inline">
              <select id="visibilityInput">
                <option value="public">전체공개</option>
                <option value="members">회원 공개</option>
                <option value="secret">비밀글</option>
              </select>
              <div class="write-secret-inline hidden" id="secretPwWrap">
                <label class="muted small" for="secretPwInput">비밀번호</label>
                <input id="secretPwInput" type="password" placeholder="비밀번호">
              </div>
            </div>
          </div>
          <div id="galleryOnlyFields" class="write-field-block hidden mt-sm">
            <div class="field-group">
              <label class="muted small" for="sourceInput">출처</label>
              <input id="sourceInput" placeholder="[출처]https://주소 입력시 출처에 링크가 걸립니다.">
            </div>
          </div>
          <div id="bookmarkOnlyFields" class="write-field-block hidden mt-sm">
            <div class="field-group">
              <label class="muted small" for="bookmarkLinkInput">링크 주소</label>
              <input id="bookmarkLinkInput" maxlength="500" placeholder="https://... 배너를 누르면 이동할 주소">
            </div>
          </div>
        </div>

        <div id="titleFields" class="write-row">
          <div class="field-group">
            <label class="write-label" for="titleInput">제목</label>
            <input id="titleInput" placeholder="제목" maxlength="200">
          </div>
        </div>

        <div id="contentFields" class="write-row">
          <div class="write-content-head">
            <label class="write-label" for="contentInput">본문</label>
          </div>
          <div class="field-group">
            <textarea id="contentInput" rows="12" class="textarea" placeholder="내용을 입력하세요."></textarea>
          </div>
        </div>

        <!-- PROFILE 스킨: 캐릭터 프로필 정보 -->
        <div class="write-row hidden" id="profileFields">
          <div class="write-label">프로필 정보</div>
          <div class="write-skin-fields mt-sm">
            <div class="field-group">
              <label class="muted small" for="profileNameEnInput">영문 이름</label>
              <input id="profileNameEnInput" maxlength="120" placeholder="English name">
            </div>
            <div class="field-group">
              <label class="muted small" for="profileAgeInput">나이</label>
              <input id="profileAgeInput" maxlength="40" placeholder="예: 21">
            </div>
            <div class="field-group">
              <label class="muted small" for="profileGenderInput">성별</label>
              <input id="profileGenderInput" maxlength="40" placeholder="예: 여성">
            </div>
            <div class="field-group">
              <label class="muted small" for="profileHeightInput">키</label>
              <input id="profileHeightInput" maxlength="40" placeholder="예: 165cm">
            </div>
            <div class="field-group write-skin-field-full">
              <label class="muted small" for="profileOneLineInput">한마디</label>
              <input id="profileOneLineInput" maxlength="300" placeholder="짧은 한마디">
            </div>
            <div class="field-group write-skin-field-full">
              <label class="muted small" for="profileFullBodyInput">캐릭터 전신 이미지</label>
              <div class="formRow">
                <input id="profileFullBodyInput" maxlength="2048" placeholder="https://... 또는 파일 선택" autocomplete="off" spellcheck="false">
                <button type="button" class="btn small" id="profileFullBodyFileBtn">파일 선택</button>
              </div>
              <input id="profileFullBodyFile" type="file" accept="image/*" class="hidden">
              <div id="profileFullBodyPreview" class="previewGrid hidden"></div>
            </div>
            <div class="field-group write-skin-field-full">
              <label class="muted small" for="profileHeadInput">캐릭터 두상 이미지</label>
              <div class="formRow">
                <input id="profileHeadInput" maxlength="2048" placeholder="https://... 또는 파일 선택" autocomplete="off" spellcheck="false">
                <button type="button" class="btn small" id="profileHeadFileBtn">파일 선택</button>
              </div>
              <input id="profileHeadFile" type="file" accept="image/*" class="hidden">
              <div id="profileHeadPreview" class="previewGrid hidden"></div>
            </div>
            <div class="field-group write-skin-field-full">
              <label class="muted small" for="profileAppearanceInput">외형</label>
              <textarea id="profileAppearanceInput" class="textarea" rows="4" maxlength="4000" placeholder="외형을 입력하세요."></textarea>
            </div>
            <div class="field-group write-skin-field-full">
              <label class="muted small" for="profilePersonalityInput">성격</label>
              <textarea id="profilePersonalityInput" class="textarea" rows="4" maxlength="4000" placeholder="성격을 입력하세요."></textarea>
            </div>
            <div class="field-group write-skin-field-full">
              <label class="muted small" for="profileEtcInput">기타</label>
              <textarea id="profileEtcInput" class="textarea" rows="4" maxlength="8000" placeholder="기타 정보를 입력하세요."></textarea>
              <label class="comment-toggle mt-sm"><input type="checkbox" id="profileEtcHtmlInput"> <span>HTML로 입력</span></label>
            </div>
          </div>
        </div>

        <!-- SCRIPT 스킨: 세션 정보 + 플레이 로그 가져오기 -->
        <div class="write-row hidden" id="scriptFields">
          <div class="write-label">세션 정보</div>
          <div class="write-skin-fields mt-sm">
            <div class="field-group">
              <label class="muted small" for="scriptSystemInput">룰 시스템</label>
              <input id="scriptSystemInput" maxlength="120" placeholder="예: Call of Cthulhu 7th">
            </div>
            <div class="field-group">
              <label class="muted small" for="scriptScenarioInput">시나리오</label>
              <input id="scriptScenarioInput" maxlength="200" placeholder="시나리오 이름">
            </div>
            <div class="field-group">
              <label class="muted small" for="scriptGmInput">GM / KP</label>
              <input id="scriptGmInput" maxlength="120" placeholder="진행자">
            </div>
            <div class="field-group">
              <label class="muted small" for="scriptPlayedAtInput">플레이 날짜</label>
              <input id="scriptPlayedAtInput" type="date">
            </div>
            <div class="field-group write-skin-field-full">
              <label class="muted small" for="scriptPlayersInput">PL / PC</label>
              <textarea id="scriptPlayersInput" class="textarea" rows="2" maxlength="1000" placeholder="참가자와 캐릭터"></textarea>
            </div>
            <div class="field-group write-skin-field-full">
              <label class="muted small" for="scriptSummaryInput">세션 요약</label>
              <textarea id="scriptSummaryInput" class="textarea" rows="3" maxlength="2000" placeholder="목록과 상세 상단에 표시할 짧은 메모"></textarea>
            </div>
            <div class="field-group write-skin-field-full script-import-field">
              <label class="muted small">플레이 로그 파일</label>
              <div class="script-source-controls">
                <label class="muted small" for="scriptSourceMode">로그 형식</label>
                <select id="scriptSourceMode" data-script-source-mode>
                  <option value="auto">자동 감지</option>
                  <option value="roll20">Roll20</option>
                  <option value="ccfolia">코코포리아</option>
                </select>
                <span class="muted small script-source-help">자동 판별 후 형식이 다르면 직접 변경하세요.</span>
              </div>
              <div class="script-import-dropzone" data-script-dropzone tabindex="0" role="button" aria-label="Roll20 또는 코코포리아 로그 파일 선택">
                <button type="button" class="btn" data-script-file-select>파일 선택</button>
                <span>Roll20·코코포리아 로그 HTML 또는 코코포리아 ZIP을 끌어놓으세요.</span>
              </div>
              <input class="hidden" type="file" accept=".html,.htm,.zip,text/html,application/zip" data-script-file-input>
              <div class="script-tabs hidden" data-script-tab-picker role="group" aria-label="올릴 탭"></div>
              <div class="script-import-footer">
                <label class="script-image-backup-option">
                  <input type="checkbox" data-script-backup-images checked>
                  <span data-script-backup-text="external">로그 이미지 저장 <span class="muted">(외부 링크 이미지를 서버에 저장하여 백업하는 기능입니다.)</span></span>
                  <span class="hidden" data-script-backup-text="embedded">캐릭터 아이콘 저장 <span class="muted">(캐릭터마다 가장 많이 쓴 아이콘 1개씩 올립니다.)</span></span>
                </label>
                <div class="script-import-status" data-script-import-status aria-live="polite"></div>
              </div>
              <dl class="script-import-result hidden" data-script-import-result aria-label="로그 분석 결과"></dl>
            </div>
          </div>
        </div>

        <details class="write-extra-details" id="extraFields">
          <summary>
            <span>추가 이미지 <span class="write-extra-caret" aria-hidden="true">▼</span></span>
            <span class="write-extra-count" id="extraItemCount" aria-live="polite"></span>
          </summary>
          <div class="write-extra-body">
            <div class="write-mode-row">
              <label><input type="radio" name="extraMode" value="file" id="extraModeFile" checked> 파일</label>
              <label><input type="radio" name="extraMode" value="url" id="extraModeUrl"> URL</label>
            </div>

            <div id="extraUrlFields" class="write-field-block hidden">
              <label class="muted small" for="extraImageUrlInput">추가 이미지 URL</label>
              <input id="extraImageUrlInput" placeholder="https://...">
            </div>

            <div id="extraFileFields" class="write-field-block">
              <div class="write-extra-dropzone" id="extraDropZone" tabindex="0" role="button" aria-label="추가 이미지 파일 선택">
                <button type="button" class="btn" id="selectExtraFileBtn">파일 선택</button>
                <span>이미지를 끌어놓거나 클릭해서 선택</span>
              </div>
              <input id="extraFileInput" type="file" accept="image/*" multiple class="hidden">
            </div>

            <div class="formRow write-extra-add-row">
              <button type="button" class="btn" id="addExtraItemBtn">추가</button>
            </div>
            <div id="extraItems" class="previewGrid write-extra-list mt-sm"></div>
            <div class="notice hidden mt-sm" id="uploadMsg"></div>
          </div>
        </details>

        <div class="write-row" id="tagFields">
          <div class="field-group">
            <label class="write-label" for="tagsInput">태그</label>
            <input id="tagsInput" placeholder="tag1, tag2, tag3">
          </div>
        </div>

        <div class="formRow write-actions write-actions-center mt-md">
          <button class="btn primary" id="saveBtn">등록</button>
          <a class="btn" id="cancelBtn" href="index.html">목록</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="muted small">&copy; NAMWALL</div>
  </footer>

  <script type="module" src="assets/js/pages/write.js"></script>
</body>
</html>
