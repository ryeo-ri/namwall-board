<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<base href="./">
  <title>홈</title>
  <link rel="stylesheet" href="assets/css/app.css?v=3">
  <link rel="stylesheet" href="assets/css/app2.css?v=3">
  <link rel="stylesheet" href="assets/css/nb.css?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://media.naru.pub">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;500;600;700;800&family=Pixelify+Sans:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <!-- 모듈 꼬리물기 로딩 방지: import 체인을 미리 병렬 다운로드 -->
  <link rel="modulepreload" href="https://sdk.naru.pub/sdk/1.1.0/naru.js">
  <link rel="modulepreload" href="assets/js/core/naru-client.js">
  <link rel="modulepreload" href="assets/js/core/config.js">
  <link rel="modulepreload" href="assets/js/core/site.js">

<body class="site-page home-page">
  <div class="header">
    <div class="container">
      <div class="row">
        <a class="brand" href="index.html">
          <span id="siteTitle"></span>
        </a>
        <nav class="nav" id="topNav"></nav>
        <div class="pills">
          <span class="pill" id="pillMember"></span>
          <span class="pill" id="pillAdmin"></span>
        </div>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="homeIntro"></div>

    <div class="grid two mt-md" id="homeMenuGrid">
      <section class="card" id="homeRecentCard">
        <h3>최근 업데이트</h3>
        <div class="grid tight" id="recentList">
          <div class="loading-indicator" role="status" aria-live="polite">
            <span class="sr-only">최근 업데이트를 불러오는 중</span>
          </div>
        </div>
      </section>

      <aside class="card" id="homeAsideCard">
        <div id="homeSearchBlock">
          <h3>검색</h3>
          <div class="formRow">
            <input id="quickTag" placeholder="태그 입력 후 검색">
            <button class="btn" id="quickSearchBtn">검색</button>
          </div>
        </div>

        <div id="homeTagsBlock">
          <hr class="sep">
          <h3>최근 태그</h3>
          <div id="recentTags">
            <div class="loading-indicator" role="status" aria-live="polite">
              <span class="sr-only">최근 태그를 불러오는 중</span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="muted small">&copy; NAMWALL</div>
  </footer>

  <script src="assets/js/shared/lightbox.js" defer></script>
  <script type="module" src="assets/js/pages/home.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"f5d3b54061e0459080bdc7fbfcc9294d","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
