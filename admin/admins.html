<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>관리자 프로필</title>
<link rel="preconnect" href="https://r2.naru.pub">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="assets/js/core/firebase.js">
<link rel="modulepreload" href="assets/js/core/state.js">
<link rel="modulepreload" href="assets/js/admin/admins-page.js">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;500;600;700;800&family=Pixelify+Sans:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
</head>
<body>
  <main class="container">
    <section class="card">
      <h2>관리자 프로필 목록</h2>
      <p class="muted small">Firebase Console을 거치지 않고 이 페이지에서 새 관리자 계정과 프로필을 함께 추가합니다.</p>
      <div class="notice small mt-sm">
        새 관리자의 이메일·비밀번호·닉네임을 입력하세요. 추가가 완료되면 해당 계정으로 바로 관리자 로그인을 할 수 있으며, 현재 관리자의 로그인 상태는 유지됩니다.
      </div>
      <div class="grid tight mt-sm">
        <input id="adminEmailInput" type="email" placeholder="새 관리자 이메일" autocomplete="off">
        <input id="adminPasswordInput" type="password" placeholder="비밀번호 6자 이상" autocomplete="new-password" minlength="6">
        <input id="adminPasswordConfirmInput" type="password" placeholder="비밀번호 재입력" autocomplete="new-password" minlength="6">
        <input id="adminNicknameInput" placeholder="새 관리자 닉네임" autocomplete="off">
        <select id="adminRoleInput">
          <option value="ADMIN">ADMIN</option>
          <option value="SUPER_ADMIN">SUPER_ADMIN</option>
        </select>
      </div>
      <div class="formRow mt-sm">
        <button class="btn primary" id="saveAdminProfileBtn">새 관리자 추가</button>
      </div>
      <div id="adminProfileMsg" class="notice hidden mt-sm"></div>
      <div id="adminsList" class="grid tight mt-sm"></div>
      <div class="formRow mt-sm">
        <a class="btn" href="admin/index.html">대시보드</a>
      </div>
    </section>
  </main>

  <script type="module" src="assets/js/admin/admins-page.js"></script>
</body>
</html>
