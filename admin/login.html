<body class="site-page admin-login-page">
  <main class="container admin-login-shell">
    <section class="card admin-login-panel">
      <div class="admin-login-head">
        <div>
          <p class="admin-login-kicker">ADMIN ACCESS</p>
          <h1>관리자 로그인</h1>
        </div>
      </div>

      <div class="grid tight mt-md">
        <div class="field-group">
          <label for="adminEmail">이메일</label>
          <input id="adminEmail" type="email" placeholder="관리자 이메일">
        </div>
        <div class="field-group">
          <label for="adminPassword">비밀번호</label>
          <input id="adminPassword" type="password" placeholder="관리자 비밀번호">
        </div>
      </div>

      <div class="formRow mt-md admin-login-actions">
        <button class="btn primary" id="adminLoginBtn">로그인</button>
        <button class="btn" id="adminLogoutBtn">로그아웃</button>
        <a class="btn" href="index.html">홈</a>
      </div>
      <div id="adminMsg" class="notice hidden mt-md"></div>
    </section>
  </main>

  <script type="module" src="assets/js/admin/login-page.js"></script>
