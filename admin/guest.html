  <main class="container">
    <section class="card">
      <h2>게스트 코드 관리</h2>
      <p class="muted small">게스트 코드는 홈페이지 내 별도 표기하지 않으니 따로 기억하거나 보관하여 주세요.</p>
      <div class="muted small" id="guestInfo">
        <span class="loading-indicator compact" role="status" aria-live="polite">
          <span class="sr-only">게스트 코드 설정을 불러오는 중</span>
        </span>
      </div>
      <div class="grid tight mt-sm">
        <input id="guestCodeInput" type="password" placeholder="새 코드 4자 이상">
      </div>
      <div class="formRow mt-sm">
        <button class="btn primary" id="saveGuestCodeBtn">코드 갱신</button>
        <a class="btn" href="admin/index.html">대시보드</a>
      </div>
      <div id="guestMsg" class="notice hidden mt-sm"></div>
    </section>
  </main>
